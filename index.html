<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotePad — Glass Notes</title>
<style>
:root{
  --text:#f6f7ff;--muted:rgba(245,247,255,.62);--line:rgba(255,255,255,.2);
  --glass:rgba(255,255,255,.105);--glass2:rgba(255,255,255,.16);
  --shadow:0 24px 70px rgba(12,15,45,.28);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
   radial-gradient(ellipse at 15% 10%,rgba(135,155,255,.8),transparent 35%),
   radial-gradient(ellipse at 85% 20%,rgba(218,147,255,.68),transparent 32%),
   radial-gradient(ellipse at 60% 95%,rgba(91,209,222,.48),transparent 35%),
   linear-gradient(135deg,#20264d,#414b80 48%,#34304f);
  background-attachment:fixed;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.12),transparent 35%,rgba(255,255,255,.03));}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #c6d1ff;outline-offset:3px}
.app{width:min(1440px,100%);margin:auto;padding:24px clamp(14px,3vw,42px) 50px;position:relative}
.topbar{
 display:flex;align-items:center;gap:18px;padding:14px 18px;border:1px solid var(--line);
 background:rgba(255,255,255,.13);backdrop-filter:blur(28px) saturate(160%);
 -webkit-backdrop-filter:blur(28px) saturate(160%);border-radius:25px;box-shadow:var(--shadow);
 position:sticky;top:12px;z-index:5;
}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap;font-size:20px;font-weight:750;letter-spacing:-.6px}
.logo{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(255,255,255,.2));border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 white,0 7px 20px #141b4638;color:#4c568e}
.logo svg{width:22px;height:22px}
.searchbox{position:relative;flex:1;max-width:610px;margin:0 auto}
.searchbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.72}
.searchbox input{width:100%;padding:13px 16px 13px 43px;color:white;background:rgba(15,20,55,.19);border:1px solid rgba(255,255,255,.19);border-radius:15px;outline:none}
.searchbox input::placeholder{color:rgba(255,255,255,.62)}
.searchbox input:focus{background:rgba(15,20,55,.28);border-color:rgba(255,255,255,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.27);background:rgba(255,255,255,.13);padding:11px 15px;border-radius:14px;transition:transform .18s,background .18s,box-shadow .18s;box-shadow:inset 0 1px 0 rgba(255,255,255,.13)}
.btn:hover{background:rgba(255,255,255,.23);transform:translateY(-2px);box-shadow:0 8px 22px rgba(12,15,45,.18)}
.btn.primary{background:linear-gradient(135deg,rgba(255,255,255,.93),rgba(224,231,255,.76));color:#323c70;border-color:rgba(255,255,255,.65);font-weight:700}
.btn.primary:hover{background:#fff}
.btn svg{width:17px;height:17px}
main{padding-top:29px}
.welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:7px 2px 24px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.66);font-weight:700}
h1{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-1.6px;margin:7px 0 8px;font-weight:750}
.subtitle{color:var(--muted);font-size:14px;margin:0}
.count-pill{padding:9px 13px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.82);font-size:13px;white-space:nowrap}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 3px 14px}
.section-head h2{font-size:14px;letter-spacing:.1px;margin:0;font-weight:700}
.section-head span{font-size:12px;color:var(--muted)}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:17px}
.note{
 min-height:218px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.31);
 border-radius:25px;padding:19px;display:flex;flex-direction:column;
 background:linear-gradient(145deg,rgba(255,255,255,.23),rgba(255,255,255,.075));
 backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);
 box-shadow:0 15px 35px rgba(13,17,49,.14),inset 0 1px 0 rgba(255,255,255,.18);
 transition:transform .2s,border-color .2s,background .2s;isolation:isolate;
}
.note:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.28;background:var(--note-tint,transparent);pointer-events:none}
.note:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.53);background:linear-gradient(145deg,rgba(255,255,255,.29),rgba(255,255,255,.105))}
.note-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.note-date{font-size:11px;color:rgba(255,255,255,.65)}
.note-actions{display:flex;gap:5px}
.icon-btn{width:29px;height:29px;display:grid;place-items:center;border:1px solid transparent;background:rgba(255,255,255,.08);border-radius:10px;color:rgba(255,255,255,.76);transition:.18s}
.icon-btn:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.2);color:white}
.icon-btn svg{width:15px;height:15px}
.note h3{font-size:17px;letter-spacing:-.35px;margin:0 0 10px;line-height:1.3;overflow-wrap:anywhere}
.note-body{font-size:13px;line-height:1.65;color:rgba(248,249,255,.77);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.note-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px}
.tag{font-size:10px;letter-spacing:.4px;text-transform:uppercase;padding:6px 9px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(255,255,255,.09);color:rgba(255,255,255,.8)}
.pin-label{font-size:10px;color:rgba(255,255,255,.72)}
.empty{grid-column:1/-1;text-align:center;padding:58px 20px;border:1px dashed rgba(255,255,255,.3);border-radius:25px;background:rgba(255,255,255,.055)}
.empty-icon{width:58px;height:58px;margin:0 auto 15px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.empty-icon svg{width:27px;height:27px;opacity:.85}
.empty h3{margin:0 0 7px;font-size:18px}.empty p{color:var(--muted);font-size:13px;margin:0 0 18px}
.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(9,12,32,.46);backdrop-filter:blur(13px)}
.overlay.open{display:flex}
.editor{width:min(590px,100%);max-height:min(90vh,850px);overflow:auto;border:1px solid rgba(255,255,255,.36);border-radius:28px;padding:23px;background:linear-gradient(145deg,rgba(100,110,165,.78),rgba(53,59,105,.83));box-shadow:0 30px 90px rgba(0,0,0,.35);backdrop-filter:blur(36px)}
.editor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.editor-head h2{font-size:21px;margin:0;letter-spacing:-.5px}
.close-btn{width:35px;height:35px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.12);font-size:20px}
.field{display:block;margin:15px 0}
.field span{display:block;font-size:12px;color:rgba(255,255,255,.75);margin:0 0 8px;font-weight:600}
.field input,.field textarea{width:100%;border:1px solid rgba(255,255,255,.22);background:rgba(15,20,55,.2);border-radius:14px;color:white;padding:13px 14px;outline:none}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.47)}
.field textarea{min-height:190px;resize:vertical;line-height:1.6}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.color-choice{width:30px;height:30px;border-radius:11px;border:2px solid rgba(255,255,255,.28);box-shadow:inset 0 0 0 2px rgba(20,20,50,.1);transition:transform .15s}
.color-choice:hover{transform:scale(1.1)}.color-choice.selected{outline:2px solid white;outline-offset:3px}
.editor-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:21px}
.editor-bottom .right{display:flex;gap:9px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:20;padding:12px 17px;border-radius:14px;border:1px solid var(--line);background:rgba(37,43,83,.9);backdrop-filter:blur(20px);box-shadow:var(--shadow);font-size:13px;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:rgba(255,255,255,.42);font-size:11px;margin-top:42px}
@media(max-width:650px){
 .app{padding:12px 12px 35px}.topbar{top:8px;flex-wrap:wrap;gap:12px;padding:12px;border-radius:21px}
 .brand{font-size:18px}.searchbox{order:3;flex-basis:100%;max-width:none}.topbar>.primary{margin-left:auto;padding:10px 12px}
 .welcome{align-items:flex-start;flex-direction:column}.notes-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr));gap:11px}
 .note{padding:15px;min-height:205px;border-radius:21px}.note h3{font-size:15px}.note-body{font-size:12px}
 .editor{padding:18px;border-radius:23px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
 <header class="topbar">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.8h8l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 20V5.3A1.5 1.5 0 0 1 6.5 3.8Z"/><path d="M14 4v4h4M8 12h8M8 16h8"/></svg></div>NotePad</div>
  <label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input id="searchInput" type="search" placeholder="Search notes by name..." autocomplete="off" aria-label="Search notes by name"></label>
  <button class="btn primary" id="newNoteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New note</button>
 </header>
 <main>
  <section class="welcome">
   <div><div class="eyebrow">Your personal space</div><h1>All your thoughts,<br>in one place.</h1><p class="subtitle">A little space for every big idea.</p></div>
   <div class="count-pill" id="noteCount">0 notes</div>
  </section>
  <section id="pinnedSection" hidden>
   <div class="section-head"><h2>✦ Pinned</h2><span id="pinnedCount"></span></div>
   <div class="notes-grid" id="pinnedGrid"></div>
  </section>
  <section>
   <div class="section-head"><h2 id="allHeading">All notes</h2><span id="resultCount"></span></div>
   <div class="notes-grid" id="notesGrid"></div>
  </section>
 </main>
 <footer>NotePad · Your notes stay in this browser</footer>
</div>

<div class="overlay" id="editorOverlay" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
 <form class="editor" id="noteForm">
  <div class="editor-head"><h2 id="editorTitle">Create a note</h2><button type="button" class="close-btn" id="closeEditor" aria-label="Close editor">×</button></div>
  <label class="field"><span>Note title</span><input id="noteTitle" maxlength="120" placeholder="Give your note a name..." required></label>
  <label class="field"><span>Your note</span><textarea id="noteBody" placeholder="Start writing something..." maxlength="12000"></textarea></label>
  <div class="field"><span>Glass tint</span><div class="color-row" id="colorChoices"></div></div>
  <div class="editor-bottom">
   <button type="button" class="btn" id="deleteInEditor" hidden>Delete</button>
   <div class="right"><button type="button" class="btn" id="cancelEditor">Cancel</button><button type="submit" class="btn primary">Save note</button></div>
  </div>
 </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
 const STORAGE_KEY = "notepad-glass-notes-v1";
 const tints = [
  {name:"Clear",value:"transparent"},
  {name:"Rose",value:"linear-gradient(135deg,rgba(255,154,190,.45),rgba(255,154,190,.06))"},
  {name:"Amber",value:"linear-gradient(135deg,rgba(255,206,130,.45),rgba(255,206,130,.06))"},
  {name:"Mint",value:"linear-gradient(135deg,rgba(123,239,207,.4),rgba(123,239,207,.06))"},
  {name:"Sky",value:"linear-gradient(135deg,rgba(130,202,255,.45),rgba(130,202,255,.06))"},
  {name:"Lavender",value:"linear-gradient(135deg,rgba(194,157,255,.48),rgba(194,157,255,.06))"}
 ];
 const $ = id => document.getElementById(id);
 const searchInput=$("searchInput"), overlay=$("editorOverlay"), form=$("noteForm");
 let notes=loadNotes(), editingId=null, selectedTint="transparent", toastTimer;
 function loadNotes(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(parsed)?parsed.filter(n=>n&&typeof n.id==="string"):[]}catch{return []}}
 function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(notes));return true}catch{showToast("Could not save. Browser storage may be full.");return false}}
 function escapeHTML(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
 function safeTint(value){return tints.some(t=>t.value===value)?value:"transparent"}
 function dateLabel(iso){const d=new Date(iso);if(Number.isNaN(d.getTime()))return "Recently";return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:d.getFullYear()!==new Date().getFullYear()?"numeric":undefined})}
 function showToast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2300)}
 function icon(name){const paths={
  pin:'<path d="m16 3 5 5-4 1-4 4-1 5-2-2-4 4-1-1 4-4-2-2 5-1 4-4z"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>'
 };return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`}
 function card(note){
  const title=escapeHTML(note.title||"Untitled note"),body=escapeHTML(note.body||"No additional text.");
  return `<article class="note" style="--note-tint:${safeTint(note.tint)}" data-note-id="${escapeHTML(note.id)}">
   <div class="note-top"><span class="note-date">${escapeHTML(dateLabel(note.updatedAt))}</span><div class="note-actions">
   <button class="icon-btn" data-action="pin" data-id="${escapeHTML(note.id)}" title="${note.pinned?"Unpin note":"Pin note"}" aria-label="${note.pinned?"Unpin note":"Pin note"}">${icon("pin")}</button>
   <button class="icon-btn" data-action="edit" data-id="${escapeHTML(note.id)}" title="Edit note" aria-label="Edit note">${icon("edit")}</button>
   <button class="icon-btn" data-action="delete" data-id="${escapeHTML(note.id)}" title="Delete note" aria-label="Delete note">${icon("trash")}</button></div></div>
   <h3>${title}</h3><div class="note-body">${body}</div>
   <div class="note-footer"><span class="tag">${note.body&&note.body.trim()?"Note":"Quick note"}</span>${note.pinned?'<span class="pin-label">✦ Pinned</span>':`<span class="pin-label">${(note.body||"").length} chars</span>`}</div>
  </article>`
 }
 function emptyMarkup(searching){
  return `<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5h8l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 20V5A1.5 1.5 0 0 1 6.5 3.5Z"/><path d="M14 4v4h4M8 13h8M8 16h5"/></svg></div><h3>${searching?"No matching notes":"Your space is ready"}</h3><p>${searching?"Try a different note title.":"Create your first note and let the ideas flow."}</p>${searching?"":'<button class="btn primary" data-action="new">＋ Create your first note</button>'}</div>`
 }
 function render(){
  const q=searchInput.value.trim().toLocaleLowerCase();
  const matching=notes.filter(n=>(n.title||"").toLocaleLowerCase().includes(q));
  const pinned=matching.filter(n=>n.pinned).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  const regular=matching.filter(n=>!n.pinned).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  $("noteCount").textContent=`${notes.length} ${notes.length===1?"note":"notes"}`;
  $("resultCount").textContent=q?`${matching.length} found`:`${matching.length} ${matching.length===1?"note":"notes"}`;
  $("allHeading").textContent=q?"Search results":"All notes";
  $("pinnedSection").hidden=pinned.length===0;
  $("pinnedCount").textContent=`${pinned.length} ${pinned.length===1?"note":"notes"}`;
  $("pinnedGrid").innerHTML=pinned.map(card).join("");
  $("notesGrid").innerHTML=regular.length?regular.map(card).join(""):(!pinned.length?emptyMarkup(!!q):"");
 }
 function openEditor(note=null){
  editingId=note?note.id:null;selectedTint=note?safeTint(note.tint):"transparent";
  $("editorTitle").textContent=note?"Edit note":"Create a note";
  $("noteTitle").value=note?.title||"";$("noteBody").value=note?.body||"";
  $("deleteInEditor").hidden=!note;
  renderColors();overlay.classList.add("open");document.body.style.overflow="hidden";
  setTimeout(()=>$("noteTitle").focus(),50);
 }
 function closeEditor(){overlay.classList.remove("open");document.body.style.overflow="";editingId=null;form.reset()}
 function renderColors(){$("colorChoices").innerHTML=tints.map(t=>`<button type="button" class="color-choice ${t.value===selectedTint?"selected":""}" data-tint="${escapeHTML(t.value)}" title="${t.name}" aria-label="${t.name}" aria-pressed="${t.value===selectedTint}" style="background:${t.value==="transparent"?"rgba(255,255,255,.12)":t.value}"></button>`).join("")}
 function deleteNote(id){const note=notes.find(n=>n.id===id);if(!note)return;if(!confirm(`Delete "${note.title||"Untitled note"}"? This cannot be undone.`))return;notes=notes.filter(n=>n.id!==id);save();render();showToast("Note deleted")}
 $("newNoteBtn").addEventListener("click",()=>openEditor());
 $("closeEditor").addEventListener("click",closeEditor);$("cancelEditor").addEventListener("click",closeEditor);
 overlay.addEventListener("click",e=>{if(e.target===overlay)closeEditor()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))closeEditor();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();searchInput.focus()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="n"){e.preventDefault();openEditor()}});
 searchInput.addEventListener("input",render);
 form.addEventListener("submit",e=>{
  e.preventDefault();const title=$("noteTitle").value.trim();if(!title){$("noteTitle").focus();return}
  const now=new Date().toISOString();
  if(editingId){const n=notes.find(n=>n.id===editingId);if(n){n.title=title;n.body=$("noteBody").value;n.tint=selectedTint;n.updatedAt=now}}
  else notes.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2),title,body:$("noteBody").value,tint:selectedTint,pinned:false,createdAt:now,updatedAt:now});
  save();closeEditor();render();showToast(editingId?"Note updated":"Note saved");
 });
 $("colorChoices").addEventListener("click",e=>{const b=e.target.closest("[data-tint]");if(!b)return;selectedTint=b.dataset.tint;renderColors()});
 document.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;const {action,id}=b.dataset;
  if(action==="new"){openEditor();return}
  const note=notes.find(n=>n.id===id);if(!note)return;
  if(action==="edit")openEditor(note);
  if(action==="pin"){note.pinned=!note.pinned;note.updatedAt=new Date().toISOString();save();render();showToast(note.pinned?"Note pinned":"Note unpinned")}
  if(action==="delete")deleteNote(id);
 });
 $("deleteInEditor").addEventListener("click",()=>{if(editingId){const id=editingId;closeEditor();deleteNote(id)}});
 render();
})();
</script>
</body>
</html>
